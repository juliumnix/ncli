<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'self' blob:; frame-ancestors 'none'" />
  <style>
    html,body,#ncli3d{margin:0;width:100%;height:100%;background:#0f0f11;color:#eeeef0;font:12px/1.3 ui-sans-serif,system-ui,sans-serif;overflow:hidden}
    #ncli3d{position:relative}
    canvas{position:absolute;inset:0;display:block;width:100%;height:100%}
    .n3-cams,.n3-parts,.n3-hint{position:absolute;z-index:2;display:flex;gap:6px;flex-wrap:wrap}
    .n3-cams{top:10px;left:10px}
    .n3-parts{top:10px;right:10px;justify-content:flex-end}
    .n3-hint{right:10px;bottom:10px;color:#a8a8b3}
    .n3-cams button,.n3-parts button{appearance:none;border:0;background:transparent;color:#a8a8b3;padding:5px 10px;border-radius:999px;font:12px/1.2 inherit;cursor:pointer}
    .n3-cams button.on{background:#6ea4ff;color:#0f0f11}
    .n3-parts button{display:inline-flex;align-items:center;gap:6px}
    .n3-parts i{width:8px;height:8px;border-radius:50%;display:inline-block}
    .n3-parts button.off{opacity:.45}
  </style>
</head>
<body>
  <div id="ncli3d"></div>
  <script src="/vendor/three.global.js"></script>
  <script src="/ncli3d.js"></script>
</body>
</html>
