<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="color-scheme" content="dark" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'self' 'unsafe-inline'; script-src 'self' blob:; connect-src 'none'; form-action 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; navigate-to 'none'" />
  <link rel="stylesheet" href="/tokens.css" />
  <style>
    html,body,#ncli3d{margin:0;width:100%;height:100%;background:#0f0f11;color:#eeeef0;color-scheme:dark;font:12px/1.3 ui-sans-serif,system-ui,sans-serif;overflow:hidden}
    .n3-err{padding:12px;color:#f2777a;font:12px/1.4 ui-sans-serif,system-ui,sans-serif;white-space:pre-wrap}
    #ncli3d{position:relative}
    canvas{position:absolute;inset:0;display:block;width:100%;height:100%}
    .n3-cams,.n3-parts,.n3-hint{position:absolute;z-index:2;display:flex;gap:6px;flex-wrap:wrap}
    .n3-cams{top:10px;left:10px}
    .n3-parts{top:10px;right:10px;justify-content:flex-end}
    .n3-hint{right:10px;bottom:10px;color:var(--muted)}
    .n3-cams button,.n3-parts button{appearance:none;border:0;background:transparent;color:var(--muted);padding:5px 10px;border-radius:999px;font:12px/1.2 inherit;cursor:pointer}
    .n3-cams button.on{background:var(--accent);color:var(--on-accent)}
    .n3-parts button{display:inline-flex;align-items:center;gap:6px}
    .n3-parts i{width:8px;height:8px;border-radius:50%;display:inline-block}
    .n3-parts button.off{opacity:.45}
  </style>
</head>
<body>
  <div id="ncli3d"></div>
  <script src="/vendor/three.global.js"></script>
  <script src="/ncli3d.js"></script>
</body>
</html>
