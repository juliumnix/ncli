<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NCLI</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preload" href="/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/JetBrainsMono-Regular.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/tokens.css" />
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <header class="top">
    <button class="burger" id="menuBtn" aria-label="menu">☰</button>
    <span class="brand">NCLI</span>
    <div class="top-cluster">
      <div class="agent-switch" id="agentSwitch"></div>
      <span class="compact-ind" id="compactInd" hidden></span>
      <span class="limit-ind" id="limitInd" hidden></span>
    </div>
    <button class="stop" id="stopBtn" hidden type="button">parar</button>
  </header>

  <aside class="drawer" id="drawer" hidden>
    <h2>NCLI</h2>
    <p class="muted">hub local · um chat infinito</p>
    <div class="ctx" id="debugPanel">
      <div class="ctx-bar">
        <div class="dbg-h">contexto</div>
        <div class="ctx-tools" role="group" aria-label="modo do contexto">
          <button type="button" class="ctx-chip on" id="ctxListBtn" data-ctx-mode="list">lista</button>
          <button type="button" class="ctx-chip" id="ctxTreeBtn" data-ctx-mode="tree">árvore</button>
          <button type="button" class="ctx-chip" id="ctxRawBtn" data-ctx-mode="raw">bruto</button>
        </div>
        <input type="checkbox" id="ctxRaw" hidden />
      </div>
      <div id="ctxHead" class="ctx-head muted"></div>
      <div id="ctxCascade" class="ctx-cascade" aria-hidden="true"></div>
      <div id="ctxList" class="ctx-list"></div>
      <div id="ctxTree" class="ctx-tree" hidden></div>
      <pre id="debugView" hidden></pre>
    </div>
    <div id="viewBlock" hidden>
      <div class="dbg-h">views</div>
      <ul id="viewList"></ul>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <main class="scroller" id="chat">
    <div class="log" id="log"></div>
  </main>
  <button type="button" class="jump-latest" id="jumpLatest" hidden>↓ agora</button>

  <aside class="shortcuts" id="shortcuts"></aside>

  <div class="dock" id="dock">
    <div class="qbar" id="ibar" hidden></div>
    <div class="qbar" id="qbar" hidden></div>
    <form class="composer" id="form">
      <input id="input" autocomplete="off" placeholder="Pergunta ou /help" />
      <button type="button" class="qbtn" id="queueBtn" hidden>fila</button>
      <button type="submit" class="send" aria-label="enviar">↑</button>
    </form>
  </div>

  <aside class="ui-pane" id="uiPane" hidden>
    <div class="ui-pane-bar">
      <span>card</span>
      <button type="button" class="ui-collapse" id="uiCollapse" aria-label="Fechar">✕</button>
    </div>
    <div class="ui-pane-body" id="uiPaneBody"></div>
  </aside>

  <div class="overlay" id="overlay" hidden>
    <div class="modal" id="modal"></div>
  </div>

  <script src="/markdown.js"></script>
  <script src="/app.js"></script>
</body>
</html>
