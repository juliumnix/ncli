name: macos-import

on:
  push:
  pull_request:

jobs:
  fd-guard:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"
      - run: bun install
      - run: bun test tests/fd-guard.test.ts tests/bunx-refresh.test.ts tests/bunx-cache.test.ts tests/revision.test.ts tests/macos-bunx-import.test.ts --timeout 60000
      - name: bunx github import
        env:
          NCLI_REVISION: ${{ github.sha }}
        run: bun scripts/macos-bunx-import.ts --bunx
