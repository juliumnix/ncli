name: macos-import

on:
  push:
  pull_request:

jobs:
  fd-guard:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        bun: ["1.3.3", "1.4.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - run: bun install
      - run: bun test tests/fd-guard.test.ts tests/bunx-refresh.test.ts tests/bunx-cache.test.ts tests/revision.test.ts tests/macos-bunx-import.test.ts tests/bun-version.test.ts --timeout 180000
      - name: bunx github import
        env:
          NCLI_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun scripts/macos-bunx-import.ts --bunx

  codex-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: bun install
      - name: Install Codex 0.160.1
        run: |
          npm install --prefix "$RUNNER_TEMP/codex" @openai/codex@0.160.1
          echo "NCLI_CODEX=$RUNNER_TEMP/codex/node_modules/.bin/codex" >> "$GITHUB_ENV"
      - name: Packed bunx keeps MCP and data
        run: bun test tests/bunx-pack-mcp.test.ts tests/pkg-root.test.ts tests/codex-linger.test.ts tests/codex-config-warning.test.ts tests/harness-children.test.ts --timeout 60000
      - name: Codex lists the ncli MCP catalog
        run: bun test tests/codex-mcp-real.test.ts --timeout 60000
